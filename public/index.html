<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G-FUEL DRINK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="index_style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="register/index.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="shop/index.html">Shop</a></li>
          </ul>
          <a class="cart-link me-3" href="cart/index.html">Cart (<span class="cart-count">0</span>)</a>
          <div id="auth-slot"></div>
        </div>
      </div>
    </nav>
    <div id="root" class="container-fluid">
      <h1>Get your energy for the day with G-Fuel</h1>
      <div class="hero-tubs">
        <img src="shop/(1)bahamamama.png" alt="Bahama Mama G-Fuel tub">
        <img src="shop/(4)Blueice.png" alt="Blue Ice G-Fuel tub">
        <img src="shop/(7)fazeberry.png" alt="FaZeberry G-Fuel tub">
        <img src="shop/(8)FaZeXx.png" alt="FaZe X G-Fuel tub">
      </div>
      <ul class="textindex">
        <li><strong>Boosts athletic performance</strong></li><br/>
        <li><strong>Helps you stay focused</strong></li><br/>
        <li><strong>Incredible taste</strong></li><br/>
      </ul>
      <p><b>Give up sugary sodas and soft drinks that drain your energy today</b></p>
      <div class="text-center">
        <a class="btn btn-success btn-lg shop-cta" href="shop/index.html">Shop now</a>
      </div>
    </div>
    <div id="contact-section" class="container mt-5">
      <h2>Keep in touch with your vendor</h2>
      <form method="POST">
        <div class="mb-3">
          <label for="name" class="form-label">Name:</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number:</label>
          <input type="tel" class="form-control" id="phone" name="phone" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message:</label>
          <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
      <div id="contact-status" class="alert alert-success mt-3" role="status" hidden></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="submitGetInTouch.js"></script>
    <script src="login.js"></script>
    <script src="cart-store.js"></script>
  </body>
</html>
