<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password - G-FUEL DRINK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../../register/register_style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../../register/index.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="../../shop/index.html">Shop</a></li>
          </ul>
          <a class="cart-link me-3" href="../../cart/index.html">Cart (<span class="cart-count">0</span>)</a>
          <div id="auth-slot"></div>
        </div>
      </div>
    </nav>

    <main class="container register-card">
      <h1>Forgot your password?</h1>
      <p class="text-muted">Enter the email you registered with. We will send you a link to choose a new password.</p>
      <form id="forgot-form" novalidate>
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
        <div class="invalid-feedback">Enter a valid email address.</div>
        <button type="submit" class="btn btn-success w-100 mt-4" id="forgot-button">Send reset link</button>
      </form>
      <div id="password-status" class="alert mt-3" role="status" hidden></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="../../login.js"></script>
    <script src="../../cart-store.js"></script>
    <script src="../password.js"></script>
  </body>
</html>
