<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - G-FUEL DRINK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../../register/register_style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../../register/index.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="../../shop/index.html">Shop</a></li>
          </ul>
          <a class="cart-link me-3" href="../../cart/index.html">Cart (<span class="cart-count">0</span>)</a>
          <div id="auth-slot"></div>
        </div>
      </div>
    </nav>

    <main class="container register-card">
      <h1>Choose a new password</h1>
      <form id="reset-form" novalidate>
        <div class="col-12 mb-3">
          <label for="password" class="form-label">New password</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
          <div class="form-text">8 to 72 characters.</div>
          <div class="invalid-feedback">Password must be 8 to 72 characters long.</div>
        </div>
        <div class="col-12">
          <label for="confirmPassword" class="form-label">Confirm new password</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>
        <button type="submit" class="btn btn-success w-100 mt-4" id="reset-button">Set new password</button>
      </form>
      <div id="password-status" class="alert mt-3" role="status" hidden></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="../../login.js"></script>
    <script src="../../cart-store.js"></script>
    <script src="../password.js"></script>
  </body>
</html>
