<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="shop_style.css">
    <title>G-FUEL Shop</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Shop</a></li>
          </ul>
          <span class="basket-count me-3" id="basket-count" aria-live="polite"></span>
          <div class="login-container d-flex" id="loginForm">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username" aria-label="Username" required/>
            <input type="password" id="password" placeholder="Password" aria-label="Password" required/>
            <button onclick="login()" type="button" class="btn btn-outline-success">Login</button>
          </div>
        </div>
      </div>
    </nav>
    <div class="container-fluid">
      <h1>Discover all G-Fuel flavors</h1>
      <form class="search-form d-flex" id="searchForm" role="search">
        <input class="form-control me-2" id="search-input" type="search" placeholder="Search for a flavor" aria-label="Search" />
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="Bahama Mama">
          <img class="product-image" src="(1)bahamamama.png" alt="Bahama Mama G-Fuel tub">
          <h2 class="product-name">Bahama Mama</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add Bahama Mama to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="Battle Juice">
          <img class="product-image" src="(2)battleJ_front.png" alt="Battle Juice G-Fuel tub">
          <h2 class="product-name">Battle Juice</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add Battle Juice to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="Black on Blackberry">
          <img class="product-image" src="(3)BlackonBlackberry.png" alt="Black on Blackberry G-Fuel tub">
          <h2 class="product-name">Black on Blackberry</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add Black on Blackberry to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="Blue Ice">
          <img class="product-image" src="(4)Blueice.png" alt="Blue Ice G-Fuel tub">
          <h2 class="product-name">Blue Ice</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add Blue Ice to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="Boysenberry">
          <img class="product-image" src="(5)boysenberry.png" alt="Boysenberry G-Fuel tub">
          <h2 class="product-name">Boysenberry</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add Boysenberry to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="Bubble Gum">
          <img class="product-image" src="(6)bubbleGum.png" alt="Bubble Gum G-Fuel tub">
          <h2 class="product-name">Bubble Gum</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add Bubble Gum to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="FaZeberry">
          <img class="product-image" src="(7)fazeberry.png" alt="FaZeberry G-Fuel tub">
          <h2 class="product-name">FaZeberry</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add FaZeberry to basket">+</button>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 product-card" data-name="FaZe X">
          <img class="product-image" src="(8)FaZeXx.png" alt="FaZe X G-Fuel tub">
          <h2 class="product-name">FaZe X</h2>
          <button type="button" class="btn btn-light btn-lg" aria-label="Add FaZe X to basket">+</button>
        </div>
      </div>
      <p id="no-results" hidden>No flavors match your search.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="../login.js"></script>
    <script src="shop.js"></script>
  </body>
</html>
