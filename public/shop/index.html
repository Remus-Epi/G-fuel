<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="shop_style.css">
    <link rel="stylesheet" type="text/css" href="../toast.css">
    <title>G-FUEL Shop</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../register/index.html">Register</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Shop</a></li>
          </ul>
          <a class="cart-link me-3" href="../cart/index.html">Cart (<span class="cart-count">0</span>)</a>
          <div id="auth-slot"></div>
        </div>
      </div>
    </nav>
    <div class="container-fluid">
      <h1>Discover all G-Fuel flavors</h1>

      <div class="shop-controls">
        <form class="search-form d-flex" id="searchForm" role="search">
          <input class="form-control me-2" id="search-input" type="search" placeholder="Search for a product" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
        <div class="filter-row">
          <div class="category-filters" id="category-filters" role="group" aria-label="Filter by category"></div>
          <label class="sort-control">
            <span>Sort by</span>
            <select class="form-select" id="sort-select">
              <option value="featured">Featured</option>
              <option value="name-asc">Name A–Z</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
      </div>

      <div id="shop-error" class="alert alert-danger" role="alert" hidden></div>
      <div class="row g-4" id="product-grid"></div>
      <p id="no-results" hidden>No products match your search.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="../login.js"></script>
    <script src="../cart-store.js"></script>
    <script src="../toast.js"></script>
    <script src="shop.js"></script>
  </body>
</html>
