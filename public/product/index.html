<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../shop/shop_style.css">
    <link rel="stylesheet" type="text/css" href="product.css">
    <link rel="stylesheet" type="text/css" href="../toast.css">
    <title>Product - G-FUEL DRINK</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../register/index.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="../shop/index.html">Shop</a></li>
          </ul>
          <a class="cart-link me-3" href="../cart/index.html">Cart (<span class="cart-count">0</span>)</a>
          <div id="auth-slot"></div>
        </div>
      </div>
    </nav>

    <main class="container product-page">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../shop/index.html">Shop</a></li>
          <li class="breadcrumb-item active" aria-current="page" id="crumb-name">Product</li>
        </ol>
      </nav>

      <div id="product-error" class="alert alert-danger" role="alert" hidden></div>

      <article id="product-view" class="product-detail" hidden>
        <div class="product-detail-image">
          <img id="product-img" src="" alt="">
        </div>
        <div class="product-detail-info">
          <div class="product-detail-category" id="product-category"></div>
          <h1 id="product-title"></h1>
          <p class="product-detail-price" id="product-price"></p>
          <p class="product-detail-description" id="product-description"></p>

          <div class="qty-control" aria-label="Quantity">
            <button type="button" class="btn btn-light btn-lg" id="qty-minus" aria-label="Remove one from cart">−</button>
            <span class="qty" id="qty-value" aria-live="polite">0</span>
            <button type="button" class="btn btn-light btn-lg" id="qty-plus" aria-label="Add one to cart">+</button>
          </div>
          <p class="product-detail-in-cart" id="in-cart"></p>
          <a class="btn btn-outline-success mt-3" href="../shop/index.html">Back to shop</a>
        </div>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="../login.js"></script>
    <script src="../cart-store.js"></script>
    <script src="../toast.js"></script>
    <script src="product.js"></script>
  </body>
</html>
