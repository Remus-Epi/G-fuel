<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../shop/shop_style.css">
    <link rel="stylesheet" type="text/css" href="cart_style.css">
    <title>G-FUEL Cart</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="../register/index.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="../shop/index.html">Shop</a></li>
          </ul>
          <a class="cart-link me-3" href="index.html" aria-current="page">Cart (<span class="cart-count">0</span>)</a>
          <div id="auth-slot"></div>
        </div>
      </div>
    </nav>

    <main class="container cart-page">
      <h1>Your cart</h1>
      <p id="cart-mode" class="cart-mode"></p>
      <div id="cart-error" class="alert alert-danger" role="alert" hidden></div>

      <div id="cart-empty" class="text-center my-5" hidden>
        <p class="fs-4">Your cart is empty.</p>
        <a class="btn btn-success" href="../shop/index.html">Go to the shop</a>
      </div>

      <div id="cart-content" hidden>
        <ul class="list-unstyled" id="cart-items"></ul>
        <div class="cart-summary">
          <div class="fs-4">Total: <strong id="cart-total">$0.00</strong></div>
          <div class="d-flex gap-2 flex-wrap justify-content-end">
            <button type="button" class="btn btn-outline-danger" id="clear-cart">Empty cart</button>
            <button type="button" class="btn btn-success" disabled title="Checkout is not available yet">Checkout (coming soon)</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="../login.js"></script>
    <script src="../cart-store.js"></script>
    <script src="cart.js"></script>
  </body>
</html>
